    body {
      background: linear-gradient(180deg, #f9fafb, #ffffff);

    header {

      border-radius: 20px;

    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #4f46e5;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #4b5563;
      margin-bottom: 28px;
    }

    .actions a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }

    footer {

      text-align: center;
      font-size: 14px;
      color: #6b7280;
